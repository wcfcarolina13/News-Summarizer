name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # audio_jobs imports requests + bs4 at load time (since 0714565) and the
      # MCP tests need the mcp package, so install the light web requirements
      # plus mcp. Still no desktop/TTS deps — those stay lazy.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyflakes -r daily_audio_briefing/requirements.txt "mcp>=1.0,<2"

      # Undefined names only: gui_app.py shipped 7 of them for months (a NameError
      # in estimate_api_usage, six except-block lambdas that ran after `e` was
      # unbound). Unused imports/variables are left to a future cleanup.
      - name: Undefined-name check (pyflakes)
        run: |
          out=$(python -m pyflakes daily_audio_briefing/*.py | grep 'undefined name' || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Run tests
        run: python -m pytest daily_audio_briefing/tests/ -q

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # audio_jobs imports requests + bs4 at load time (since 0714565) and the
      # MCP tests need the mcp package, so install the light web requirements
      # plus mcp. Still no desktop/TTS deps — those stay lazy.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r daily_audio_briefing/requirements.txt "mcp>=1.0,<2"

      - name: Run tests
        run: python -m pytest daily_audio_briefing/tests/ -q
